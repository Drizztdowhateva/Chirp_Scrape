<?xml version="1.0" encoding="UTF-8"?>
<!--
Simple logo: combines a ham radio tower (left) with code brackets and AI circuit motif (right).
Colors: Deep blue primary, orange accent, teal nodes.
Designed to be scalable as SVG.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B3D91"/>
      <stop offset="100%" stop-color="#00A3A3"/>
    </linearGradient>
    <style>
      .bg{fill: none}
      .tower{fill:#0B3D91}
      .accent{fill:#FF8A00}
      .node{fill:#00A3A3}
      .bracket{fill:none;stroke:#0B3D91;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
      .ai-text{font-family:Inter, Arial, sans-serif; font-weight:700; font-size:72px; fill:url(#grad)}
    </style>
  </defs>

  <!-- left: stylized ham radio tower -->
  <g transform="translate(80,50)">
    <!-- tower legs -->
    <polygon class="tower" points="120,10 140,10 320,430 300,430"/>
    <polygon class="tower" points="40,10 60,10 240,430 220,430"/>
    <!-- crossbars -->
    <rect x="120" y="130" width="120" height="12" rx="6" fill="#0B3D91"/>
    <rect x="80" y="230" width="200" height="12" rx="6" fill="#0B3D91"/>
    <!-- antenna head -->
    <circle cx="180" cy="-6" r="20" class="accent"/>
    <!-- waves -->
    <path d="M180,-6 m-60,0 a60,60 0 1,0 120,0" stroke="#FF8A00" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M180,-6 m-100,0 a100,100 0 1,0 200,0" stroke="#FF8A00" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- right: code + AI circuit -->
  <g transform="translate(420,60)">
    <!-- left bracket -->
    <path class="bracket" d="M0,20 L40,0 L40,80 L0,60"/>
    <!-- right bracket -->
    <path class="bracket" d="M300,20 L260,0 L260,80 L300,60"/>

    <!-- AI circuit: central chip -->
    <rect x="110" y="10" width="100" height="80" rx="12" fill="#081b4a" stroke="#0B3D91" stroke-width="6"/>
    <text x="160" y="65" text-anchor="middle" class="ai-text">AI</text>

    <!-- circuit traces and nodes -->
    <line x1="160" y1="18" x2="160" y2="-10" stroke="#0B3D91" stroke-width="6" stroke-linecap="round"/>
    <circle class="node" cx="160" cy="-18" r="8"/>

    <line x1="120" y1="40" x2="80" y2="40" stroke="#0B3D91" stroke-width="6" stroke-linecap="round"/>
    <circle class="node" cx="64" cy="40" r="8"/>

    <line x1="200" y1="40" x2="240" y2="40" stroke="#0B3D91" stroke-width="6" stroke-linecap="round"/>
    <circle class="node" cx="256" cy="40" r="8"/>

    <line x1="120" y1="80" x2="80" y2="110" stroke="#0B3D91" stroke-width="6" stroke-linecap="round"/>
    <circle class="node" cx="64" cy="126" r="8"/>

    <line x1="200" y1="80" x2="240" y2="110" stroke="#0B3D91" stroke-width="6" stroke-linecap="round"/>
    <circle class="node" cx="256" cy="126" r="8"/>
  </g>

  <!-- optional tagline -->
  <text x="420" y="420" font-family="Inter, Arial, sans-serif" font-size="24" fill="#243B7A">Ham Radio × Code — AI-driven signals</text>

</svg>
