<?xml version="1.0" encoding="UTF-8"?>
<!-- Composite scene: UV5R left, computer right, crosstalk waves between -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="100%" height="100%" fill="#071233"/>

  <!-- place UV5R (reused shape simplified) -->
  <g transform="translate(60,60) scale(1.2)">
    <use href="uv5r.svg#svgroot"/>
    <!-- fallback simplified body -->
    <rect x="30" y="40" rx="18" ry="18" width="180" height="520" fill="#12263A"/>
    <rect x="48" y="130" width="144" height="70" rx="8" fill="#A7E0FF" stroke="#0B3D91" stroke-width="4"/>
  </g>

  <!-- place computer terminal (simplified) -->
  <g transform="translate(540,80) scale(0.9)">
    <rect x="80" y="40" rx="18" ry="18" width="640" height="360" fill="#0B3D91"/>
    <rect x="120" y="90" width="560" height="260" rx="8" fill="#071233"/>
    <text x="160" y="130" font-family="monospace" font-size="20" fill="#7CFFB2">$ ./rolling_code -k key.secret --hashtags test</text>
  </g>

  <!-- crosstalk overlay waves across scene -->
  <g transform="translate(200,240)">
    <path d="M0,0 C120,-80 240,80 360,0 C480,-80 600,80 720,0" fill="none" stroke="#FF8A00" stroke-width="8" opacity="0.9"/>
    <path d="M0,30 C120,110 240,-50 360,30 C480,110 600,-50 720,30" fill="none" stroke="#00A3A3" stroke-width="6" stroke-dasharray="14 8" opacity="0.9"/>
  </g>

  <!-- labels + shebang -->
  <text x="80" y="520" font-family="sans-serif" font-size="18" fill="#fff">UV-5R</text>
  <text x="540" y="540" font-family="sans-serif" font-size="18" fill="#fff">Laptop / Terminal</text>
  <text x="600" y="60" font-family="monospace" font-size="28" fill="#FF8A00">#!shebang</text>

</svg>
