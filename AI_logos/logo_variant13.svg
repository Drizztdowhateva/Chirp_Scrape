<?xml version="1.0" encoding="UTF-8"?>
<!-- Variant 13: Ike Pelican-style rugged case motif + radios inside + shebang -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <rect width="100%" height="100%" fill="#071233"/>

  <!-- pelican case -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="780" height="240" rx="12" fill="#13314A" stroke="#0B3D91" stroke-width="6"/>
    <!-- latches -->
    <rect x="28" y="200" width="36" height="12" rx="4" fill="#0B3D91"/>
    <rect x="716" y="200" width="36" height="12" rx="4" fill="#0B3D91"/>
    <!-- handle -->
    <rect x="380" y="208" width="140" height="16" rx="6" fill="#0E2133"/>

    <!-- inner padding with radios -->
    <g transform="translate(60,24)" fill="#0E2133">
      <rect x="0" y="0" width="140" height="160" rx="8"/>
      <rect x="180" y="0" width="140" height="160" rx="8"/>
      <rect x="360" y="0" width="140" height="160" rx="8"/>
      <rect x="540" y="0" width="140" height="160" rx="8"/>
    </g>
  </g>

  <!-- shebang label -->
  <text x="120" y="40" font-family="monospace" font-size="28" fill="#FF8A00">#!shebang</text>

  <text x="450" y="400" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9fb6d6">Ike Pelican case — rugged transport for radios</text>
</svg>
