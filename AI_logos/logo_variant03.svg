<?xml version="1.0" encoding="UTF-8"?>
<!-- Variant 03: cluster of five radios forming a circle -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <rect width="100%" height="100%" fill="#071233"/>
  <g transform="translate(350,350)">
    <!-- place 5 radios around circle -->
    <g transform="rotate(0) translate(180, -70)">
      <rect x="-40" y="-80" width="80" height="160" rx="10" fill="#12263A"/>
    </g>
    <g transform="rotate(72) translate(180, -70)">
      <rect x="-40" y="-80" width="80" height="160" rx="10" fill="#0B3D91"/>
    </g>
    <g transform="rotate(144) translate(180, -70)">
      <rect x="-40" y="-80" width="80" height="160" rx="10" fill="#13314A"/>
    </g>
    <g transform="rotate(216) translate(180, -70)">
      <rect x="-40" y="-80" width="80" height="160" rx="10" fill="#0B3D91"/>
    </g>
    <g transform="rotate(288) translate(180, -70)">
      <rect x="-40" y="-80" width="80" height="160" rx="10" fill="#12263A"/>
    </g>

    <!-- center AI motif -->
    <circle cx="0" cy="0" r="44" fill="#081b4a" stroke="#00A3A3" stroke-width="6"/>
    <text x="0" y="12" text-anchor="middle" font-size="28" fill="#00A3A3" font-family="sans-serif">AI</text>
  </g>
</svg>
