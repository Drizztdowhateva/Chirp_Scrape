<?xml version="1.0" encoding="UTF-8"?>
<!-- Variant 07: radios on a map pins layout (network) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="100%" height="100%" fill="#071233"/>
  <g fill="#0B3D91">
    <!-- pins with small radio icons -->
    <g transform="translate(120,120)">
      <circle cx="0" cy="0" r="28" fill="#FF8A00"/>
      <rect x="-12" y="-36" width="24" height="48" rx="6" fill="#12263A"/>
    </g>
    <g transform="translate(320,60)">
      <circle cx="0" cy="0" r="28" fill="#00A3A3"/>
      <rect x="-12" y="-36" width="24" height="48" rx="6" fill="#12263A"/>
    </g>
    <g transform="translate(540,180)">
      <circle cx="0" cy="0" r="28" fill="#FF8A00"/>
      <rect x="-12" y="-36" width="24" height="48" rx="6" fill="#12263A"/>
    </g>
    <g transform="translate(720,100)">
      <circle cx="0" cy="0" r="28" fill="#00A3A3"/>
      <rect x="-12" y="-36" width="24" height="48" rx="6" fill="#12263A"/>
    </g>
  </g>
  <text x="450" y="480" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9fb6d6">Networked radios (map pins)</text>
</svg>
