<?xml version="1.0" encoding="UTF-8"?>
<!-- Variant 11: UV5R mini 'photo' placeholder + shebang + mini TP-Link & Pelican icons -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <rect width="100%" height="100%" fill="#071233"/>

  <!-- UV5R mini photo placeholder -->
  <g transform="translate(60,40)">
    <rect x="0" y="0" width="240" height="320" rx="12" fill="#0E2133" stroke="#A7E0FF" stroke-width="4"/>
    <text x="120" y="170" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#A7E0FF">UV5R mini photo</text>
    <rect x="28" y="240" width="184" height="6" rx="3" fill="#0B3D91"/>
  </g>

  <!-- shebang ribbon -->
  <g transform="translate(340,60)">
    <rect x="0" y="0" width="560" height="80" rx="8" fill="#081b4a" opacity="0.95"/>
    <text x="280" y="52" text-anchor="middle" font-family="monospace" font-size="36" fill="#FF8A00">#!shebang</text>
  </g>

  <!-- small TP-Link 310n motif -->
  <g transform="translate(340,170)">
    <!-- travel router shape -->
    <rect x="0" y="0" width="160" height="80" rx="10" fill="#0B3D91"/>
    <rect x="12" y="12" width="136" height="56" rx="6" fill="#071233"/>
    <text x="80" y="48" text-anchor="middle" font-size="16" fill="#7CFFB2">310N</text>
    <!-- tiny antenna -->
    <rect x="148" y="-26" width="8" height="46" rx="4" fill="#0E2133"/>
  </g>

  <!-- small Pelican-style case motif -->
  <g transform="translate(540,170)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#13314A"/>
    <rect x="18" y="14" width="184" height="52" rx="6" fill="#0E2133"/>
    <rect x="18" y="14" width="44" height="52" rx="6" fill="#0B3D91"/>
    <text x="110" y="48" text-anchor="middle" font-size="14" fill="#9fb6d6">Ike Pelican Case</text>
  </g>

  <text x="500" y="400" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9fb6d6">UV5R mini + #!shebang + 310N (TP-Link) + Pelican case</text>
</svg>
