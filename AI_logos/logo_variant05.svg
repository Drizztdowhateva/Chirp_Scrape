<?xml version="1.0" encoding="UTF-8"?>
<!-- Variant 05: alternating radios and laptops in a row -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
  <rect width="100%" height="100%" fill="#071233"/>
  <g transform="translate(40,30)">
    <!-- pattern: radio, laptop, radio, laptop -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="120" height="200" rx="12" fill="#12263A"/>
    </g>
    <g transform="translate(160,0)">
      <rect x="0" y="20" width="160" height="120" rx="12" fill="#0B3D91"/>
      <rect x="16" y="40" width="128" height="72" rx="6" fill="#071233"/>
    </g>
    <g transform="translate(360,0)">
      <rect x="0" y="0" width="120" height="200" rx="12" fill="#13314A"/>
    </g>
    <g transform="translate(520,0)">
      <rect x="0" y="20" width="160" height="120" rx="12" fill="#0B3D91"/>
      <rect x="16" y="40" width="128" height="72" rx="6" fill="#071233"/>
    </g>
  </g>
  <text x="500" y="240" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9fb6d6">Alternating Radios & Laptops</text>
</svg>
