<?xml version="1.0" encoding="UTF-8"?>
<!-- Variant 02: grid of four radios with AI chip motif -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="100%" height="100%" fill="#071233"/>
  <g transform="translate(80,60)">
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="140" height="220" rx="12" fill="#12263A"/>
      <rect x="18" y="24" width="104" height="44" rx="6" fill="#A7E0FF"/>
    </g>
    <g transform="translate(180,0)">
      <rect x="0" y="0" width="140" height="220" rx="12" fill="#0B3D91"/>
      <rect x="18" y="24" width="104" height="44" rx="6" fill="#FFE5C2"/>
    </g>
    <g transform="translate(0,260)">
      <rect x="0" y="0" width="140" height="220" rx="12" fill="#0B3D91"/>
      <rect x="18" y="24" width="104" height="44" rx="6" fill="#A7E0FF"/>
    </g>
    <g transform="translate(180,260)">
      <rect x="0" y="0" width="140" height="220" rx="12" fill="#13314A"/>
      <rect x="18" y="24" width="104" height="44" rx="6" fill="#A7E0FF"/>
    </g>

    <!-- AI chip centered -->
    <rect x="380" y="140" width="160" height="80" rx="12" fill="#081b4a" stroke="#0B3D91" stroke-width="6"/>
    <text x="460" y="190" text-anchor="middle" font-size="36" fill="#00A3A3" font-family="sans-serif">AI</text>
  </g>

  <text x="400" y="780" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9fb6d6">Grid radios + AI</text>
</svg>
