<?xml version="1.0" encoding="UTF-8"?>
<!-- Variant 06: long chain of radios decreasing in size (perspective) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <rect width="100%" height="100%" fill="#071233"/>
  <g transform="translate(40,40)">
    <!-- draw 8 radios scaling down -->
    <g fill="#12263A">
      <rect x="0" y="0" width="160" height="260" rx="12"/>
      <rect x="200" y="10" width="140" height="230" rx="12"/>
      <rect x="380" y="20" width="120" height="200" rx="12"/>
      <rect x="520" y="30" width="100" height="170" rx="12"/>
      <rect x="640" y="40" width="80" height="140" rx="10"/>
      <rect x="740" y="50" width="64" height="112" rx="8"/>
      <rect x="820" y="60" width="48" height="84" rx="6"/>
      <rect x="890" y="68" width="36" height="62" rx="4"/>
    </g>
  </g>
  <text x="600" y="340" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9fb6d6">Perspective chain</text>
</svg>
