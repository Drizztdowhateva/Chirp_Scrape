<?xml version="1.0" encoding="UTF-8"?>
<!-- Variant 09: stylized radio array with waveform background -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <rect width="100%" height="100%" fill="#071233"/>
  <!-- waveform background -->
  <path d="M0,200 C120,120 240,280 360,200 C480,120 600,280 720,200 C840,120 900,200" fill="none" stroke="#FF8A00" stroke-width="6" opacity="0.7"/>

  <g transform="translate(60,40)" fill="#12263A">
    <rect x="0" y="0" width="120" height="200" rx="12"/>
    <rect x="160" y="20" width="120" height="180" rx="12"/>
    <rect x="320" y="40" width="120" height="160" rx="12"/>
    <rect x="480" y="60" width="120" height="140" rx="12"/>
    <rect x="640" y="80" width="120" height="120" rx="12"/>
  </g>
  <text x="450" y="340" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9fb6d6">Array & waveform</text>
</svg>
