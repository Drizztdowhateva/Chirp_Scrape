<?xml version="1.0" encoding="UTF-8"?>
<!-- Variant 10: collage with radios, terminal, and crosstalk accents -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="100%" height="100%" fill="#071233"/>

  <!-- left cluster radios -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="120" height="200" rx="12" fill="#12263A"/>
    <rect x="24" y="24" width="72" height="40" rx="6" fill="#A7E0FF"/>
    <rect x="0" y="220" width="120" height="20" rx="6" fill="#0B3D91"/>
  </g>

  <!-- center terminal -->
  <g transform="translate(420,80)">
    <rect x="0" y="0" width="420" height="280" rx="18" fill="#0B3D91"/>
    <rect x="32" y="36" width="356" height="208" rx="8" fill="#071233"/>
    <text x="210" y="120" font-family="monospace" font-size="22" fill="#7CFFB2" text-anchor="middle">#TEST: 533627</text>
  </g>

  <!-- right radios cluster -->
  <g transform="translate(980,60) scale(0.9)">
    <rect x="-160" y="0" width="120" height="200" rx="12" fill="#0B3D91"/>
    <rect x="-40" y="20" width="120" height="200" rx="12" fill="#12263A"/>
  </g>

  <!-- crosstalk accents -->
  <path d="M240,220 C360,140 840,300 960,220" fill="none" stroke="#FF8A00" stroke-width="10" opacity="0.9"/>
  <path d="M240,260 C360,340 840,180 960,260" fill="none" stroke="#00A3A3" stroke-width="6" stroke-dasharray="12 8" opacity="0.9"/>

  <text x="600" y="560" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9fb6d6">Collage: radios, terminal & crosstalk</text>
</svg>
