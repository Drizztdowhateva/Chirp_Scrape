<?xml version="1.0" encoding="UTF-8"?>
<!-- Variant 04: panorama with many small radios (density layout) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <rect width="100%" height="100%" fill="#071233"/>
  <g fill="#12263A">
    <!-- repeated small radios -->
    <!-- row 1 -->
    <g transform="translate(40,30)">
      <!-- generate 12 small boxes -->
      <!-- using explicit elements for portability -->
      <g>
        <rect x="0" y="0" width="60" height="90" rx="8"/>
        <rect x="80" y="0" width="60" height="90" rx="8"/>
        <rect x="160" y="0" width="60" height="90" rx="8"/>
        <rect x="240" y="0" width="60" height="90" rx="8"/>
        <rect x="320" y="0" width="60" height="90" rx="8"/>
        <rect x="400" y="0" width="60" height="90" rx="8"/>
        <rect x="480" y="0" width="60" height="90" rx="8"/>
        <rect x="560" y="0" width="60" height="90" rx="8"/>
        <rect x="640" y="0" width="60" height="90" rx="8"/>
        <rect x="720" y="0" width="60" height="90" rx="8"/>
        <rect x="800" y="0" width="60" height="90" rx="8"/>
        <rect x="880" y="0" width="60" height="90" rx="8"/>
      </g>
    </g>
    <!-- row 2 -->
    <g transform="translate(40,140)">
      <rect x="0" y="0" width="60" height="90" rx="8"/>
      <rect x="80" y="0" width="60" height="90" rx="8"/>
      <rect x="160" y="0" width="60" height="90" rx="8"/>
      <rect x="240" y="0" width="60" height="90" rx="8"/>
      <rect x="320" y="0" width="60" height="90" rx="8"/>
      <rect x="400" y="0" width="60" height="90" rx="8"/>
      <rect x="480" y="0" width="60" height="90" rx="8"/>
      <rect x="560" y="0" width="60" height="90" rx="8"/>
      <rect x="640" y="0" width="60" height="90" rx="8"/>
      <rect x="720" y="0" width="60" height="90" rx="8"/>
      <rect x="800" y="0" width="60" height="90" rx="8"/>
      <rect x="880" y="0" width="60" height="90" rx="8"/>
    </g>
  </g>

  <text x="600" y="340" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9fb6d6">Dense radios panorama</text>
</svg>
