<?xml version="1.0" encoding="UTF-8"?>
<!-- Variant 01: three handheld radios in a row -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <rect width="100%" height="100%" fill="#071233"/>
  <g transform="translate(60,40)">
    <!-- radio 1 -->
    <rect x="0" y="0" width="140" height="260" rx="16" fill="#102840"/>
    <rect x="18" y="40" width="104" height="60" rx="8" fill="#A7E0FF" stroke="#0B3D91" stroke-width="3"/>
    <rect x="8" y="120" width="124" height="140" rx="8" fill="#0E2133"/>
  </g>

  <g transform="translate(330,40)">
    <!-- radio 2 (accent) -->
    <rect x="0" y="0" width="140" height="260" rx="16" fill="#0B3D91"/>
    <rect x="18" y="40" width="104" height="60" rx="8" fill="#FFE5C2" stroke="#FF8A00" stroke-width="3"/>
    <rect x="8" y="120" width="124" height="140" rx="8" fill="#0E2133"/>
  </g>

  <g transform="translate(600,40)">
    <!-- radio 3 -->
    <rect x="0" y="0" width="140" height="260" rx="16" fill="#13314A"/>
    <rect x="18" y="40" width="104" height="60" rx="8" fill="#A7E0FF" stroke="#0B3D91" stroke-width="3"/>
    <rect x="8" y="120" width="124" height="140" rx="8" fill="#0E2133"/>
  </g>

  <text x="450" y="290" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#9fb6d6">Multiple Radios — variant 01</text>
</svg>
