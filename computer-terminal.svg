<?xml version="1.0" encoding="UTF-8"?>
<!-- Stylized computer monitor with terminal text -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <style>
    .monitor{fill:#0B3D91}
    .screen{fill:#071233}
    .text-green{fill:#7CFFB2}
    .stand{fill:#243B7A}
    .keyboard{fill:#0E2133}
  </style>

  <!-- monitor body -->
  <rect x="80" y="40" rx="18" ry="18" width="640" height="360" class="monitor"/>
  <rect x="120" y="90" width="560" height="260" rx="8" class="screen"/>

  <!-- terminal lines -->
  <g font-family="monospace" font-size="22">
    <text x="140" y="130" class="text-green">$ ./rolling_code -k key.secret --hashtags test</text>
    <text x="140" y="170" class="text-green">#TEST: 533627</text>
    <text x="140" y="210" class="text-green">#AI: 237959</text>
  </g>

  <!-- stand -->
  <rect x="360" y="410" width="80" height="18" class="stand" rx="6"/>
  <rect x="320" y="428" width="160" height="20" class="keyboard" rx="6"/>

  <!-- keyboard keys (suggestive) -->
  <g fill="#243B7A">
    <rect x="330" y="432" width="12" height="8" rx="2"/>
    <rect x="348" y="432" width="12" height="8" rx="2"/>
    <rect x="366" y="432" width="12" height="8" rx="2"/>
    <rect x="384" y="432" width="12" height="8" rx="2"/>
  </g>
</svg>
